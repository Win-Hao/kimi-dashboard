name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # dist/cli.js is committed because kimi-code installs the plugin straight from the GitHub zip;
      # fail if someone forgot to rebuild before committing.
      - run: git diff --exit-code -- dist
        if: runner.os != 'Windows'
      # Cold-start budget (SPEC §6.1). Windows runners spawn node noticeably slower; keep a looser
      # guard there so the check still catches regressions without being flaky.
      - run: npm run bench
        env:
          KIMI_DASHBOARD_BENCH_STAT: p95
          KIMI_DASHBOARD_BENCH_MAX_P99_MS: ${{ runner.os == 'Windows' && '300' || '150' }}
